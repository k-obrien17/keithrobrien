name: Changelog digest

on:
  schedule:
    # 12:00 UTC = 8am ET (EDT); drifts to 7am during EST.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-changelog-commit

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Send digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO_EMAIL: keith@totalemphasis.com
        run: node scripts/changelog-digest.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- content/collect/digest-state.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/collect/digest-state.json
          git commit -m "chore(collect): advance changelog digest state"
          git push

      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HC_UUID_CHANGELOG_DIGEST }}" || true

      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HC_UUID_CHANGELOG_DIGEST }}/fail" || true
