name: Playlist snapshot

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-changelog-commit

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/snapshot-playlist.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- content/site/listening-log.json content/collect/best-of-changelog.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/site/listening-log.json content/collect/best-of-changelog.json
          git commit -m "chore(collect): update playlist changelogs"
          git push

      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HC_UUID_PLAYLIST_SNAPSHOT }}" || true

      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HC_UUID_PLAYLIST_SNAPSHOT }}/fail" || true
